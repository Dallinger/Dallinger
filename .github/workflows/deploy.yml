name: Release
on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-
      - name: Build distributions
        run: |
          pip install --upgrade pip build
          python -m build --sdist --wheel .
      - name: Deploy
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docker-images:
    runs-on: ubuntu-latest
    environment: ghcr
    steps:
      - name: Get version
        id: vars
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Pre-releases and patches to older release lines must not move the latest tags.
          newest="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            | sed -n 's#.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -V | tail -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$version" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Login to Github ghcr
        uses: docker/login-action@v4
        with:
          # The GHCR_TOKEN in Dallinger's ghcr environment was created by user silviot
          username: silviot
          password: ${{ secrets.GHCR_TOKEN }}
          registry: ghcr.io
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ghcr.io/dallinger/dallinger docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          load: false
          target: dallinger
          tags: |
            ghcr.io/dallinger/dallinger:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'ghcr.io/dallinger/dallinger:latest' || '' }}
      - name: Build ghcr.io/dallinger/dallinger-bot docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          load: false
          target: dallinger-bot
          tags: |
            ghcr.io/dallinger/dallinger-bot:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'ghcr.io/dallinger/dallinger-bot:latest' || '' }}
