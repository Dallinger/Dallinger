name: Release
on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-
      - name: Build distributions
        run: |
          pip install --upgrade pip build
          python -m build --sdist --wheel .
      - name: Deploy
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docker-images:
    runs-on: ubuntu-latest
    environment: ghcr
    steps:
      - name: Get version
        id: vars
        run: |
          version="${GITHUB_REF#refs/*/v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pre-releases and patches to older release lines must not move the latest tags.
          newest="$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' \
            | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$version" = "$newest" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Newest release: $newest. Tagging $version as latest: $latest"
      - name: Login to Github ghcr
        uses: docker/login-action@v4
        with:
          # The GHCR_TOKEN in Dallinger's ghcr environment was created by user silviot
          username: silviot
          password: ${{ secrets.GHCR_TOKEN }}
          registry: ghcr.io
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ghcr.io/dallinger/dallinger docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          load: false
          target: dallinger
          tags: |
            ghcr.io/dallinger/dallinger:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'ghcr.io/dallinger/dallinger:latest' || '' }}
      - name: Build ghcr.io/dallinger/dallinger-bot docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          load: false
          target: dallinger-bot
          tags: |
            ghcr.io/dallinger/dallinger-bot:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.latest == 'true' && 'ghcr.io/dallinger/dallinger-bot:latest' || '' }}
